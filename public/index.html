<!doctype html>
<html lang="es">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
      :root {

        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0f14;
        color: #e9eef5;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;

        width: min(720px, 100%);

      h1 {
        margin: 0 0 12px;

        color: #aeb8c5;

      code {
        display: block;
        overflow-wrap: anywhere;
        border: 1px solid #2b3542;
        background: #121922;
        color: #8df7b5;
        padding: 14px;
        border-radius: 8px;

  <body>
    <main>
      <h1>API_HINDRAX</h1>
      <p>Firebase Hosting esta configurado para el proyecto Hindrax. La API REST se ejecuta por separado en el backend Node.</p>
